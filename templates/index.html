<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot da ANJE - Formação</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f2f5;
        }
        h1 { color: #1a1a2e; font-size: 1.4em; margin-bottom: 4px; }
        h1 + p { color: #666; margin-top: 0; font-size: 0.9em; }
        .chat-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 0.95em;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background-color: #f1f3f5;
            color: #222;
            border-bottom-left-radius: 4px;
        }
        .bot-message a { color: #0066cc !important; text-decoration: underline !important; word-break: break-all; }
        .bot-message a:hover { color: #004499 !important; }
        .bot-message strong { color: #1a1a2e; }
        .chat-input { display: flex; padding: 12px 16px; background: #fff; border-top: 1px solid #e0e0e0; gap: 8px; }
        .chat-input input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; outline: none; font-size: 0.95em; }
        .chat-input input:focus { border-color: #007bff; }
        .chat-input button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 24px; cursor: pointer; font-size: 0.95em; }
        .chat-input button:hover { background: #0056b3; }
        .chat-input button:disabled { background: #ccc; cursor: not-allowed; }
        .typing-dots span { display: inline-block; width: 7px; height: 7px; background: #999; border-radius: 50%; margin: 0 2px; animation: blink 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,80%,100% { opacity:0.2; } 40% { opacity:1; } }
    </style>
</head>
<body>
    <h1>🤖 ChatBot da ANJE - Formação</h1>
    <p>Pergunte sobre cursos, formações, preços, datas, equipa e mais.</p>
    <div class="chat-container" id="chatContainer">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Ex: Quais os cursos de IA?">
            <button id="sendButton">Enviar</button>
        </div>
    </div>

<script>
var isWaiting = false;

function addBotMsg(text) {
    var div = document.createElement('div');
    div.className = 'message bot-message';
    div.innerHTML = formatText(text);
    document.getElementById('chatMessages').appendChild(div);
    div.scrollIntoView({behavior: 'smooth'});
}

function addUserMsg(text) {
    var div = document.createElement('div');
    div.className = 'message user-message';
    div.textContent = text;
    document.getElementById('chatMessages').appendChild(div);
    div.scrollIntoView({behavior: 'smooth'});
}

function addTyping(id) {
    var div = document.createElement('div');
    div.id = id;
    div.className = 'message bot-message';
    div.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
    document.getElementById('chatMessages').appendChild(div);
}

function removeTyping(id) {
    var el = document.getElementById(id);
    if (el) el.remove();
}

function formatText(text) {
    if (!text) return '';
    text = text.replace(/&#8211;/g, '–').replace(/&#8212;/g, '—').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ');
    var html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/\n/g, '<br>');
    return html;
}

function doSend() {
    if (isWaiting) return;
    var inp = document.getElementById('userInput');
    var msg = inp.value.trim();
    if (!msg) return;
    isWaiting = true;
    document.getElementById('sendButton').disabled = true;
    addUserMsg(msg);
    inp.value = '';
    var tid = 't' + Date.now();
    addTyping(tid);
    fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: msg})
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        removeTyping(tid);
        addBotMsg(d.response || 'Erro na resposta.');
    })
    .catch(function() {
        removeTyping(tid);
        addBotMsg('Erro de ligação. Tente novamente.');
    })
    .finally(function() {
        isWaiting = false;
        document.getElementById('sendButton').disabled = false;
        inp.focus();
    });
}

document.getElementById('sendButton').addEventListener('click', doSend);
document.getElementById('userInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doSend();
});

// Welcome
addBotMsg('Olá! 👋 Sou o assistente virtual da ANJE Formação.\n\nPosso ajudar com:\n\n• 📚 **Cursos disponíveis** (temos mais de 95 cursos!)\n• 💰 **Preços e datas**\n• 🔗 **Links para inscrição**\n• 📍 **Modalidades** (online, presencial)\n• 👥 **Equipa e órgãos sociais**\n\nO que procura?');
</script>
</body>
</html>
